services:
  - type: web
    name: windjammer-workout-tracker
    runtime: node
    plan: free
    branch: fix/workout-reliability
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
