<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/style.css">
<title>Add exercise | Windjammer</title>
</head>
<body><a class="skip-link" href="#main">Skip to content</a><nav aria-label="Main navigation"><a class="brand" href="/">Windjammer <span>Workout Tracker</span></a><div class="nav-links"><a href="/">Summary</a><a href="/stats">Dashboard</a><button class="logout button-link" type="button">Sign out</button></div></nav><main id="main" class="wrapper"><header><h1>Add your exercise</h1><p>Save an exercise to start or continue your workout.</p></header><section class="card exercise"><form id="exercise-form" novalidate><div class="field"><label for="type">Exercise type</label><select id="type" required><option value="">Choose an exercise type</option><option value="resistance">Resistance</option><option value="cardio">Cardio</option></select></div><fieldset class="cardio-form" hidden><legend>Cardio exercise</legend><div class="field"><label for="cardio-name">Name</label><input id="cardio-name" type="text" maxlength="120" placeholder="Running" required></div><div class="field"><label for="distance">Distance (miles)</label><input id="distance" type="number" min="0.01" max="1000" step="any" placeholder="5" required></div><div class="field"><label for="duration">Duration (minutes)</label><input id="duration" type="number" min="0.01" max="1440" step="any" placeholder="30" required></div></fieldset><fieldset class="resistance-form" hidden><legend>Resistance exercise</legend><div class="field"><label for="name">Exercise name</label><input id="name" type="text" maxlength="120" placeholder="Bench press" required></div><div class="field"><label for="weight">Load (lb)</label><input id="weight" type="number" min="0" max="5000" step="any" placeholder="100" required></div><div class="field"><label for="sets">Sets</label><input id="sets" type="number" min="1" max="1000" step="1" placeholder="3" required></div><div class="field"><label for="reps">Repetitions per set</label><input id="reps" type="number" min="1" max="1000" step="1" placeholder="10" required></div><div class="field"><label for="resistance-duration">Duration (minutes)</label><input id="resistance-duration" type="number" min="0.01" max="1440" step="any" placeholder="20" required></div></fieldset><p id="form-status" class="status" role="status" aria-live="polite"></p><div class="buttons"><button type="submit" class="add-another positive" disabled>Save & add another</button><button type="submit" class="complete" disabled>Save & finish</button></div><p class="form-note">Your workout is saved only after a successful submission. <a href="/">Return to summary</a></p></form></section></main><script src="/api.js"></script><script src="/metrics.js"></script><script src="/exercise.js"></script><script src="/auth.js"></script>
</body>
</html>
